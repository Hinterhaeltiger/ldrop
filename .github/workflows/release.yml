# Build and publish a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Tags with a suffix (v0.2.0-alpha.1) become pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential protobuf-compiler qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qmake6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Pack
        run: packaging/dist.sh "${GITHUB_REF_NAME#v}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=
          case "$GITHUB_REF_NAME" in *-*) flags=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "ldrop $GITHUB_REF_NAME" --generate-notes --verify-tag $flags
