[workspace]
resolver = "3"
members = [
    "crates/ldrop-core",
    "crates/ldrop-wifi",
    "crates/ldrop-ble",
    "crates/ldrop-bt",
    "crates/ldrop-quickshare",
    "crates/ldrop-airdrop",
    "crates/ldrop-mdns",
    "crates/ldropd",
    "crates/ldrop-client",
    "crates/ldrop-cli",
    "crates/ldrop-tui",
    "crates/ldrop-gui",
]
# Vendored upstream crates, patched in below.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"
repository = "https://example.invalid/ldrop"

[workspace.dependencies]
ldrop-core = { path = "crates/ldrop-core" }
ldrop-wifi = { path = "crates/ldrop-wifi" }
ldrop-ble = { path = "crates/ldrop-ble" }
ldrop-bt = { path = "crates/ldrop-bt" }
ldrop-quickshare = { path = "crates/ldrop-quickshare" }
ldrop-airdrop = { path = "crates/ldrop-airdrop" }
ldrop-mdns = { path = "crates/ldrop-mdns" }
ldrop-client = { path = "crates/ldrop-client" }
ldropd = { path = "crates/ldropd" }

aes = "0.9"
anyhow = "1"
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc"] }
clap = { version = "4.6", features = ["derive"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-build = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
hkdf = "0.13"
hmac = "0.13"
mdns-sd = "0.21"
mime_guess = "2"
nix = { version = "0.31", features = ["fs", "net", "hostname", "socket"] }
owly-airdrop = { version = "=0.1.0", default-features = false, features = ["tokio", "mdns"] }
p256 = { version = "0.14", features = ["ecdh"] }
prost = "0.14"
prost-build = "0.14"
rand = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "fs", "io-util", "io-std", "process"] }
tokio-util = "0.7"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
wl-nl80211 = "0.8"
zbus = { version = "6.1", default-features = false, features = ["tokio", "proxy", "service", "object-manager"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# owly-airdrop 0.1.0 plus receive progress and cancel, an event for an abandoned upload, and a
# spool directory and an "asking" event for sending; see third_party/README.md. Drop this once
# upstream has them.
[patch.crates-io]
owly-airdrop = { path = "third_party/owly-airdrop" }
